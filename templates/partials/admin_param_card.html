<article class="admin-card admin-card--param" id="card-{{ param.key }}">
    <header class="admin-card__head">
        <h2 class="admin-tooltip">
            {{ param.label }}
            {% if param.help %}<span class="admin-tooltip__text">{{ param.help }}</span>{% endif %}
        </h2>
        <span class="admin-card__key">{{ param.key }}</span>
    </header>

    {% if param.kind == "bool" %}
    <select name="{{ param.key }}" class="admin-input">
        <option value="true" {% if param.value == true %}selected{% endif %}>Вкл</option>
        <option value="false" {% if param.value == false %}selected{% endif %}>Выкл</option>
    </select>
    {% elif param.kind == "int" %}
    <input type="number" name="{{ param.key }}" class="admin-input"
           value="{{ param.value if param.value is not none else '' }}"
           min="0" step="1"
           placeholder="{{ param.placeholder or '' }}">
    {% elif param.kind == "float" %}
    <input type="number" name="{{ param.key }}" class="admin-input"
           value="{{ '' if param.value is none else param.value }}"
           min="0" max="2" step="0.1"
           placeholder="{{ param.placeholder or '' }}">
    {% else %}
    <input type="text" name="{{ param.key }}" class="admin-input"
           value="{{ '' if param.value is none else param.value }}"
           placeholder="{{ param.placeholder or '' }}">
    {% endif %}
</article>
