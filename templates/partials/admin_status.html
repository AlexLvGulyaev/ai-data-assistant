<div class="admin-status admin-status--{{ status_kind }}">
    <span class="admin-status__icon">{{ '✓' if status_kind == 'ok' else '✕' }}</span>
    <span>{{ status_message }}</span>
</div>
<script>
    // Toast: авто-скрытие через 5с. Статус показывается всплывающим уведомлением
    // (фиксированная позиция, вне потока), а не занимает вертикальное место в админке.
    (function () {
        var t = document.querySelector('#admin-status > .admin-status');
        if (!t) return;
        setTimeout(function () {
            t.style.transition = 'opacity .3s ease, transform .3s ease';
            t.style.opacity = '0';
            t.style.transform = 'translateY(8px)';
            setTimeout(function () { if (t.parentNode) t.remove(); }, 320);
        }, 5000);
    })();
</script>
